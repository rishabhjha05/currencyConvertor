<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"></stop>
      <stop offset="50%" stop-color="#12121f"></stop>
      <stop offset="100%" stop-color="#0d0d18"></stop>
    </linearGradient>

    
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#2a1f4d" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#2a1f4d" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0f2a3f" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#0f2a3f" stop-opacity="0"></stop>
    </radialGradient>

    
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.4"></path>
    </pattern>

    
    <pattern id="diagonal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L40 0" stroke="#334155" stroke-width="0.5" opacity="0.15"></path>
    </pattern>
  </defs>

  
  <rect width="100%" height="100%" fill="url(#bgGradient)"></rect>

  
  <rect width="100%" height="100%" fill="url(#glow1)"></rect>
  <rect width="100%" height="100%" fill="url(#glow2)"></rect>
  <rect width="100%" height="100%" fill="url(#glow3)"></rect>

  
  <rect width="100%" height="100%" fill="url(#grid)"></rect>
  <rect width="100%" height="100%" fill="url(#diagonal)"></rect>

  
  <circle cx="300" cy="200" r="180" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.2"></circle>
  <circle cx="300" cy="200" r="120" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.15"></circle>
  
  <circle cx="1600" cy="800" r="220" fill="none" stroke="#2a1f4d" stroke-width="1.5" opacity="0.18"></circle>
  <circle cx="1600" cy="800" r="150" fill="none" stroke="#2a1f4d" stroke-width="1" opacity="0.12"></circle>

  
  <path d="M100 900 Q400 700 700 850 T1300 750" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.2"></path>
  <path d="M200 150 Q600 300 1000 180 T1700 250" fill="none" stroke="#2a1f4d" stroke-width="1" opacity="0.15"></path>

  
  <g fill="#64748b" opacity="0.08" font-family="Arial, sans-serif" font-weight="bold">
    <text x="180" y="420" font-size="140">$</text>
    <text x="1450" y="280" font-size="110">€</text>
    <text x="850" y="920" font-size="130">¥</text>
    <text x="1200" y="550" font-size="90">£</text>
    <text x="450" y="780" font-size="100">₹</text>
  </g>

  
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="250" cy="350" r="2"></circle>
    <circle cx="780" cy="180" r="1.5"></circle>
    <circle cx="1100" cy="420" r="2"></circle>
    <circle cx="1550" cy="320" r="1.8"></circle>
    <circle cx="400" cy="650" r="1.5"></circle>
    <circle cx="900" cy="700" r="2"></circle>
    <circle cx="1400" cy="600" r="1.5"></circle>
    <circle cx="600" cy="480" r="1.8"></circle>
  </g>
</svg>
